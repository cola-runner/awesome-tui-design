[meta]
id = "spinner.thinking"
name = "Thinking"
description = "AI thinking indicator with growing dots"
category = "animation"
tags = ["spinner", "loading", "thinking", "ai", "agent", "llm"]
author = "tui-art"
license = "MIT"
format_version = "0.1"

[size]
width = 3
height = 1

[animation]
interval_ms = 300
loop = true

[[animation.frames]]
[animation.frames.variants]
ascii = ".  "
unicode = "·  "

[[animation.frames]]
[animation.frames.variants]
ascii = ".. "
unicode = "·· "

[[animation.frames]]
[animation.frames.variants]
ascii = "..."
unicode = "···"

[[animation.frames]]
[animation.frames.variants]
ascii = " .."
unicode = " ··"

[[animation.frames]]
[animation.frames.variants]
ascii = "  ."
unicode = "  ·"

[[animation.frames]]
[animation.frames.variants]
ascii = "   "
unicode = "   "

[colors.16.palette]
default = "magenta"

[colors.truecolor.palette]
default = "#a855f7"
